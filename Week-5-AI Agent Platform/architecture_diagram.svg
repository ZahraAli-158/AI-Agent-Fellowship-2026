<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6D28D9"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="800" fill="#18181B">AI Workspace Platform — System Architecture</text>

  <!-- Frontend Layer -->
  <rect x="60" y="80" width="1080" height="110" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="90" y="108" font-size="15" font-weight="700" fill="#6D28D9">PRESENTATION LAYER — Streamlit (frontend/)</text>
  <g font-size="13" fill="#3F3F46">
    <rect x="90" y="122" width="140" height="50" rx="8" fill="#ffffff" stroke="#C4B5FD"/>
    <text x="160" y="152" text-anchor="middle">app.py (Auth +</text>
    <text x="160" y="166" text-anchor="middle">Workspace Shell)</text>

    <rect x="250" y="122" width="150" height="50" rx="8" fill="#ffffff" stroke="#C4B5FD"/>
    <text x="325" y="152" text-anchor="middle">Dashboard /</text>
    <text x="325" y="166" text-anchor="middle">Chat / Skills</text>

    <rect x="420" y="122" width="150" height="50" rx="8" fill="#ffffff" stroke="#C4B5FD"/>
    <text x="495" y="152" text-anchor="middle">Knowledge Base /</text>
    <text x="495" y="166" text-anchor="middle">Memory / Prompts</text>

    <rect x="590" y="122" width="170" height="50" rx="8" fill="#ffffff" stroke="#C4B5FD"/>
    <text x="675" y="152" text-anchor="middle">Assistant Settings</text>
    <text x="675" y="166" text-anchor="middle">(nav.py shared shell)</text>

    <rect x="780" y="122" width="160" height="50" rx="8" fill="#ffffff" stroke="#C4B5FD"/>
    <text x="860" y="152" text-anchor="middle">api_client.py</text>
    <text x="860" y="166" text-anchor="middle">(REST wrapper)</text>

    <rect x="960" y="122" width="150" height="50" rx="8" fill="#ffffff" stroke="#C4B5FD"/>
    <text x="1035" y="152" text-anchor="middle">theme.py /</text>
    <text x="1035" y="166" text-anchor="middle">components.py</text>
  </g>

  <line x1="600" y1="190" x2="600" y2="225" stroke="#6D28D9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="212" font-size="12" fill="#6D28D9">HTTPS / JSON (JWT Bearer)</text>

  <!-- API Layer -->
  <rect x="60" y="230" width="1080" height="90" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="90" y="256" font-size="15" font-weight="700" fill="#1D4ED8">API LAYER — FastAPI Routers (backend/app/api/)</text>
  <text x="90" y="280" font-size="12.5" fill="#3F3F46">auth · workspaces · assistants · conversations · documents · memory · prompts · skills · dashboard · export · voice</text>
  <text x="90" y="300" font-size="12" fill="#71717A">Every workspace-scoped route enforces ownership/membership before touching data (see Security Review)</text>

  <line x1="600" y1="320" x2="600" y2="350" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service Layer -->
  <rect x="60" y="355" width="1080" height="130" rx="14" fill="#ECFDF5" stroke="#22C55E" stroke-width="2"/>
  <text x="90" y="381" font-size="15" font-weight="700" fill="#15803D">SERVICE LAYER — Business Logic (backend/app/services/)</text>
  <g font-size="12.5" fill="#3F3F46">
    <rect x="90" y="395" width="220" height="70" rx="8" fill="#ffffff" stroke="#86EFAC"/>
    <text x="200" y="418" text-anchor="middle" font-weight="600">chat_service.py</text>
    <text x="200" y="436" text-anchor="middle">History + Memory Recall</text>
    <text x="200" y="452" text-anchor="middle">injection + Usage Logging</text>

    <rect x="330" y="395" width="220" height="70" rx="8" fill="#ffffff" stroke="#86EFAC"/>
    <text x="440" y="418" text-anchor="middle" font-weight="600">knowledge/ (RAG)</text>
    <text x="440" y="436" text-anchor="middle">extract → chunk → embed</text>
    <text x="440" y="452" text-anchor="middle">→ semantic search</text>

    <rect x="570" y="395" width="220" height="70" rx="8" fill="#ffffff" stroke="#86EFAC"/>
    <text x="680" y="418" text-anchor="middle" font-weight="600">skills/registry.py</text>
    <text x="680" y="436" text-anchor="middle">10 reusable AI skill</text>
    <text x="680" y="452" text-anchor="middle">prompt builders</text>

    <rect x="810" y="395" width="300" height="70" rx="8" fill="#FDF4FF" stroke="#D8B4FE" stroke-width="2"/>
    <text x="960" y="418" text-anchor="middle" font-weight="700" fill="#7E22CE">llm/factory.py — get_provider()</text>
    <text x="960" y="436" text-anchor="middle" font-size="11.5">resolves model → provider, falls back</text>
    <text x="960" y="452" text-anchor="middle" font-size="11.5">to Mock only when unconfigured</text>
  </g>

  <line x1="960" y1="465" x2="960" y2="500" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="465" x2="300" y2="500" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM Providers -->
  <rect x="740" y="505" width="400" height="90" rx="14" fill="#FDF4FF" stroke="#A855F7" stroke-width="2"/>
  <text x="770" y="530" font-size="14" font-weight="700" fill="#7E22CE">LLM PROVIDERS (pluggable)</text>
  <g font-size="12" fill="#3F3F46">
    <rect x="760" y="542" width="80" height="40" rx="6" fill="#ffffff" stroke="#D8B4FE"/>
    <text x="800" y="566" text-anchor="middle">Gemini</text>
    <rect x="850" y="542" width="80" height="40" rx="6" fill="#ffffff" stroke="#D8B4FE"/>
    <text x="890" y="566" text-anchor="middle">OpenAI</text>
    <rect x="940" y="542" width="90" height="40" rx="6" fill="#ffffff" stroke="#D8B4FE"/>
    <text x="985" y="566" text-anchor="middle">Anthropic</text>
    <rect x="1040" y="542" width="80" height="40" rx="6" fill="#F4F4F5" stroke="#D4D4D8"/>
    <text x="1080" y="566" text-anchor="middle">Mock</text>
  </g>

  <!-- Persistence Layer -->
  <rect x="60" y="505" width="440" height="90" rx="14" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
  <text x="90" y="530" font-size="14" font-weight="700" fill="#B45309">PERSISTENCE LAYER</text>
  <g font-size="12" fill="#3F3F46">
    <rect x="90" y="542" width="180" height="40" rx="6" fill="#ffffff" stroke="#FCD34D"/>
    <text x="180" y="566" text-anchor="middle">SQLAlchemy Models</text>
    <rect x="290" y="542" width="190" height="40" rx="6" fill="#ffffff" stroke="#FCD34D"/>
    <text x="385" y="566" text-anchor="middle">SQLite (dev) / PostgreSQL</text>
  </g>

  <line x1="300" y1="595" x2="300" y2="625" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Database tables strip -->
  <rect x="60" y="630" width="1080" height="70" rx="14" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="90" y="653" font-size="13" font-weight="700" fill="#3F3F46">12 Tables</text>
  <text x="90" y="675" font-size="11.5" fill="#71717A">users · workspaces · workspace_members · assistants · conversations · messages · documents · chunks · prompt_templates · skill_runs · memory_items · usage_logs</text>

  <text x="600" y="740" text-anchor="middle" font-size="12" fill="#71717A">Cross-cutting: JWT auth · bcrypt hashing · per-IP rate limiting · structured logging</text>
</svg>
