{% extends "base.html" %}
{% block title %}Log in — AI Workspace Platform{% endblock %}
{% block guest_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand center"><span class="brand-mark">✦</span><span class="brand-text">AI Workspace</span></div>
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to continue to your workspaces.</p>

    <form method="POST" class="auth-form">
      <label>Username or email</label>
      <input type="text" name="identifier" value="{{ identifier|default('') }}" required autofocus placeholder="jane_doe or jane@company.com">

      <label>Password</label>
      <input type="password" name="password" required placeholder="••••••••">

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
  </div>
</div>
{% endblock %}
